[package]
name = "janjacord-mls"
version = "0.1.0"
edition = "2021"
description = "JanjaCord MLS wrapper (wasm-bindgen) — group E2EE via mls-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mls-rs = { version = "0.55", default-features = false, features = ["std", "rfc_compliant", "tree_index"] }
mls-rs-core = { version = "0.27", default-features = false, features = ["std"] }
base64 = "0.22"
ed25519-dalek = "2"
zeroize = "1"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
mls-rs-crypto-rustcrypto = { version = "0.22", features = ["browser"] }
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mls-rs-crypto-rustcrypto = { version = "0.22" }

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
hex = "0.4.3"
