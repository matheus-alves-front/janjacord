name: Windows unsigned test artifact

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-unsigned-test.yml"
      - "apps/desktop/**"
      - "apps/janjanode/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-unsigned-test.yml"
      - "apps/desktop/**"
      - "apps/janjanode/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

concurrency:
  group: windows-unsigned-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-unsigned-test:
    name: Package explicitly unsigned NSIS artifact
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      JANJACORD_SOURCE_FROZEN: "1"

    steps:
      - name: Checkout immutable workflow snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.25.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.17.0
          cache: pnpm

      - name: Install modern node-gyp for VS2026 runner image
        shell: pwsh
        run: |
          npm install -g node-gyp@12.4.0
          "npm_config_node_gyp=$(npm root -g)\node-gyp\bin\node-gyp.js" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install locked dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify Windows trust store merges into Node default anchors
        shell: pwsh
        run: |
          $script = @'
          const tls = require("node:tls");
          if (typeof tls.getCACertificates !== "function" || typeof tls.setDefaultCACertificates !== "function") {
            throw new Error("node build without tls.getCACertificates/setDefaultCACertificates");
          }
          const system = tls.getCACertificates("system");
          if (system.length === 0) throw new Error("Windows trust store reported no anchors");
          tls.setDefaultCACertificates([...new Set([...system, ...tls.rootCertificates])]);
          const merged = tls.getCACertificates("default").length;
          if (merged <= tls.getCACertificates("bundled").length) {
            throw new Error("merge did not widen the default anchors");
          }
          console.log("trust merge ok: system=" + system.length + " default=" + merged);
          '@
          node -e $script

      - name: Build workspace packages
        shell: pwsh
        run: pnpm build

      - name: Typecheck desktop
        shell: pwsh
        run: pnpm --filter @janjacord/desktop typecheck

      - name: Test Windows packaging provenance gates
        shell: pwsh
        working-directory: apps/desktop
        run: node scripts/package-windows.mjs --self-test

      - name: Validate release configuration before build
        shell: pwsh
        run: pnpm --filter @janjacord/desktop run validate:release-config

      - name: Build unsigned test installer
        shell: pwsh
        run: pnpm --filter @janjacord/desktop run dist:win:test

      - name: Verify artifact is present and unsigned
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem "apps/desktop/release" -File -Filter "*.exe")
          if ($artifacts.Count -eq 0) { throw "No Windows installer was produced" }
          foreach ($artifact in $artifacts) {
            if ($artifact.Length -gt 262144000) {
              throw "Windows test artifact exceeds 250 MiB: $($artifact.Name) ($($artifact.Length) bytes)"
            }
            $signature = Get-AuthenticodeSignature $artifact.FullName
            if ($signature.Status -ne "NotSigned") {
              throw "Test artifact must be explicitly unsigned; got $($signature.Status): $($artifact.Name)"
            }
          }
          $checksums = $artifacts | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash *$($_.Name)"
          }
          Set-Content -Path "apps/desktop/release/SHA256SUMS.txt" -Value $checksums -Encoding ascii

      - name: Upload unsigned test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UNSIGNED-TEST-ONLY-janjacord-windows-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/JanjaCord-source-*.tar
            apps/desktop/release/JanjaCord-source-*.tar.sha256
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
